name: Macro host format diagnostic

on:
  push:

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Show gofmt diff
        run: gofmt -s -d internal/app/macro_host_test.go